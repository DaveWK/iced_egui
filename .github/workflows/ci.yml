name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-wasm:
    # Public PR code must not automatically execute on the private runner.
    if: github.repository == 'DaveWK/iced_egui' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, redhat, iced-egui]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      XDG_RUNTIME_DIR: ${{ runner.temp }}/iced-egui-runtime
    steps:
      - name: Verify runner environment
        run: |
          set -euo pipefail
          source /etc/os-release
          case "$ID" in
            fedora|rhel|centos|rocky|almalinux) ;;
            *) echo "A Fedora/RHEL-family runner is required; found $ID" >&2; exit 1 ;;
          esac
          for command in git curl tar gzip zstd cc c++ pkg-config; do
            command -v "$command"
          done
          pkg-config --exists fontconfig wayland-client xkbcommon
          install -d -m 700 "$XDG_RUNTIME_DIR"
          # Use Mesa's software Vulkan driver so tests need no physical GPU.
          icd=$(rpm -ql mesa-vulkan-drivers.x86_64 | awk '/\/lvp.*\.json$/ {print; exit}')
          test -n "$icd" && test -f "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features fira-sans,plotters,primary-selection -- -D warnings
      - run: cargo check --no-default-features
      - run: cargo test --features fira-sans,plotters,primary-selection
      - name: Vulkan integration test
        run: cargo test --features fira-sans,plotters,primary-selection --lib -- --ignored --nocapture
      - run: cargo doc --no-deps --features fira-sans,plotters,primary-selection
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --target wasm32-unknown-unknown --features fira-sans,plotters,webgl
